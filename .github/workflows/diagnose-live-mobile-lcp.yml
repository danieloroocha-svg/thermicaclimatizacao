name: Read Google PageSpeed LCP details
on:
  push:
    branches:
      - perf/lcp-mobile-diagnostic-2026-11
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Request PageSpeed Insights report without API key
        run: |
          curl -sSL --max-time 100 --get https://www.googleapis.com/pagespeedonline/v5/runPagespeed \
            --data-urlencode "url=https://thermicaclimatizacao.com.br/" \
            --data-urlencode "strategy=mobile" \
            --data-urlencode "category=performance" \
            -o /tmp/thermica-psi.json -w "PSI_HTTP_STATUS:%{http_code} TIME:%{time_total}\n"
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/thermica-psi.json','utf8'));
          if(d.error){
            console.log('API_ERROR:',JSON.stringify(d.error).slice(0,2500));
            process.exit(0);
          }
          const l=d.lighthouseResult||{};
          const audits=l.audits||{};
          console.log('PSI_SCORE:',l.categories?.performance?.score);
          console.log('METRICS:',JSON.stringify(Object.fromEntries(['first-contentful-paint','largest-contentful-paint','total-blocking-time','speed-index','cumulative-layout-shift'].map(x=>[x,{value:audits[x]?.numericValue,display:audits[x]?.displayValue}]))));
          for(const [key,v] of Object.entries(audits))if(/lcp|largest-contentful-paint|render-blocking|image-delivery|network-dependency|unused-javascript/i.test(key)){
            console.log('AUDIT:',key,JSON.stringify({title:v.title,score:v.score,details:v.details}).slice(0,12000));
          }
          NODE
