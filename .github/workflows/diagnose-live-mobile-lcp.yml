name: Diagnose live HTML and image preload
on:
  push:
    branches:
      - perf/lcp-mobile-diagnostic-2026-11
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect unmodified production response and initial HTML
        run: |
          curl -sSL --max-time 35 --compressed -o /tmp/thermica-home.html -w "HTML_STATUS:%{http_code} TTFB:%{time_starttransfer} TOTAL:%{time_total} TRANSFER:%{size_download}\n" https://thermicaclimatizacao.com.br/
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/thermica-home.html','utf8');
          console.log('HTML_BYTES:',Buffer.byteLength(html),'HEAD:',html.slice(0,350).replace(/\n/g,' '));
          for(const [name,re] of [
            ['H1',/<h1\b[^>]*>[\s\S]{0,450}<\/h1>/i],
            ['HEAD_PRELOADS',/<link[^>]+rel=["']preload["'][^>]*>/ig],
            ['STYLESHEETS',/<link[^>]+rel=["']stylesheet["'][^>]*>/ig],
            ['IMAGE_ELEMENT',/<picture[\s\S]{0,1800}<\/picture>/i],
            ['SCRIPT_ELEMENTS',/<script[^>]*src=["'][^"']+["'][^>]*>/ig]
          ]) {
            const all=[...html.matchAll(re)];
            console.log(name+' COUNT:',all.length);
            for(const m of all.slice(0,8)) console.log(name+':',m[0].slice(0,1000));
          }
          if(!html.includes('Soluções VRV/VRF para ambientes')) console.log('WARNING: target hero heading absent from response');
          const pic=(html.match(/<source\b[^>]*srcSet=["']([^"']+)["'][^>]*>/i)||[])[1];
          const preloads=[...html.matchAll(/<link[^>]+rel=["']preload["'][^>]*>/ig)].map(x=>x[0]);
          console.log('MOBILE_HERO:',pic||'NOT FOUND');
          console.log('PRELOAD_FOR_MOBILE:',preloads.some(x=>x.includes('max-width: 767px')));
          NODE
      - name: Inspect image headers and transfer
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/thermica-home.html','utf8');
          const pic=(html.match(/<source\b[^>]*srcSet=["']([^"']+)["'][^>]*>/i)||[])[1];
          if(!pic)process.exit(0);
          const url=new URL(pic,'https://thermicaclimatizacao.com.br').toString();
          console.log('Checking hero:',url);
          fs.writeFileSync('/tmp/mobile-hero.url',url);
          NODE
          if [ -s /tmp/mobile-hero.url ]; then
            curl -sSL --max-time 35 -o /dev/null -w "IMAGE_STATUS:%{http_code} TTFB:%{time_starttransfer} TOTAL:%{time_total} BYTES:%{size_download}\n" "$(cat /tmp/mobile-hero.url)"
          fi
