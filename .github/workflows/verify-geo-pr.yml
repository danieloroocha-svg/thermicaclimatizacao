name: Verify GEO PR (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - "public/robots.txt"
      - "src/lib/site-data.ts"
      - "src/routes/__root.tsx"
      - "src/routes/index.tsx"
      - "src/components/seo-keyword-landing.tsx"
      - "src/routes/instalacao-ar-condicionado-vrf-para-empresas.tsx"
      - "src/routes/conteudo.$slug.tsx"
      - "scripts/verify-geo.mjs"
      - ".github/workflows/verify-geo-pr.yml"
permissions:
  contents: read
jobs:
  geo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        run: bun run build
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: GEO and route invariants
        run: node scripts/verify-geo.mjs
