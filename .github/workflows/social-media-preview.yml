name: THERMICA Social Media - Revisao segura
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "social_media/**"
      - ".github/workflows/social-media-preview.yml"
  schedule:
    - cron: "0 12 * * *"
permissions:
  contents: read
concurrency:
  group: social-media-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes sem publicacao
        run: node --test social_media/tests.mjs
      - name: Revisar fila editorial, sem publicar
        run: node social_media/runner.mjs
