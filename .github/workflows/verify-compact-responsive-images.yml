name: Check and generate compact responsive images
on:
  push:
    branches:
      - perf/mobile-images-and-font-preconnect-2026-11
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate eight image variants
        if: "!contains(github.event.head_commit.message, 'generated compact card images')"
        run: |
          python -m pip install --disable-pip-version-check pillow
          python .github/scripts/optimize-mobile-cards-and-logo.py
      - name: Verify outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          names=["osasco","lapa","indaiatuba","baroneza","hospital","centro-sp","universidade"]
          images=[Path(f"src/assets/obra-{name}-card-700.webp") for name in names]
          images.append(Path("src/assets/thermica-logo-header-mobile.webp"))
          assert all(x.exists() for x in images)
          print("Generated:",len(images),"Total bytes:",sum(x.stat().st_size for x in images))
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Production build
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Verify mobile source and original preservation
        run: |
          grep -q 'srcSet={project.thumbMedium}' src/components/project-grid.tsx
          grep -q 'srcSet={SITE.headerLogoMobile}' src/components/site-shell.tsx
          grep -q 'media: "(min-width: 768px)"' src/routes/__root.tsx
          test -s src/assets/obra-osasco.webp
          test -s src/assets/thermica-logo-header.webp
      - name: Commit optimized assets only after checks
        if: "!contains(github.event.head_commit.message, 'generated compact card images')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/*-card-700.webp src/assets/thermica-logo-header-mobile.webp
          git commit -m "perf(images): generated compact card images"
          BASIC=$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $BASIC" push origin HEAD:perf/mobile-images-and-font-preconnect-2026-11
