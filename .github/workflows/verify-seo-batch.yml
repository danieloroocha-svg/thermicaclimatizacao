name: Verify SEO pages 61-70
on:
  push:
    branches:
      - seo/lote-61-70
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build website and generate typed route tree
        run: bun run build
      - name: TypeScript validation
        run: bunx tsc --noEmit
      - name: Verify new routes in route tree
        run: |
          for route in pmoc-ar-condicionado-valor-por-maquina como-fazer-projeto-de-ar-condicionado-vrf laudo-tecnico-de-ar-condicionado-crea projeto-de-climatizacao-industrial-galpao comissionamento-de-sistemas-hvac responsabilidade-tecnica-manutencao-ar-condicionado-crea balanceamento-de-sistemas-de-ar-condicionado projeto-de-pressurizacao-de-escada-de-incendio comissionamento-de-ar-condicionado-vrf balanceamento-hidraulico-hvac-agua-gelada; do
            grep -q "$route" src/routeTree.gen.ts || exit 1
          done
