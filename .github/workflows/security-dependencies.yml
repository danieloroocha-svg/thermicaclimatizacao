name: Security dependencies - Hostinger

on:
  push:
    branches:
      - security/hostinger-dependencies-2026-11

permissions:
  contents: write

jobs:
  audit-build-lock:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout safely without persisted authentication
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve patched versions and update lockfile
        run: bun install --ignore-scripts
      - name: Apply compatible audit fixes within allowed version ranges
        run: bun audit fix --ignore-scripts || true
      - name: Install resolved lockfile and validate
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build website and generate typed route tree
        run: bun run build
      - name: Check TypeScript after route generation
        run: bunx tsc --noEmit
      - name: Audit final dependencies
        run: |
          bun audit --json > security-audit.json || true
          bun audit || true
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: security-audit.json
      - name: Commit regenerated lockfile on security branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "chore(security): regenerate tested Bun lockfile [skip ci]"
          basic=$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $basic" push origin HEAD:security/hostinger-dependencies-2026-11
